name: Athena Motion Lab - Bootstrap assets

on:
  push:
    branches:
      - athena-motion-lab-v0
    paths:
      - .github/workflows/athena-motion-lab-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout motion lab branch
        uses: actions/checkout@v4
        with:
          ref: athena-motion-lab-v0
          fetch-depth: 0

      - name: Download pinned GSAP and starter SVG libraries
        shell: pwsh
        run: ./motion-lab/scripts/setup-assets.ps1

      - name: Verify downloaded files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            motion-lab/vendor/gsap/gsap.min.js
            motion-lab/vendor/gsap/CustomEase.min.js
            motion-lab/vendor/gsap/MorphSVGPlugin.min.js
            motion-lab/vendor/gsap/DrawSVGPlugin.min.js
            motion-lab/vendor/gsap/MotionPathPlugin.min.js
            motion-lab/vendor/gsap/Flip.min.js
            motion-lab/assets/sources/open-doodles/groovy.svg
            motion-lab/assets/sources/open-doodles/unboxing.svg
            motion-lab/assets/sources/open-doodles/meditating.svg
            motion-lab/assets/sources/open-doodles/roller-skating.svg
            motion-lab/assets/sources/open-peeps/peep-57.svg
            motion-lab/assets/sources/open-peeps/peep-86.svg
            motion-lab/assets/sources/open-peeps/peep-2.svg
            motion-lab/assets/sources/highlights/arrow-01.svg
            motion-lab/assets/sources/highlights/arrow-02.svg
            motion-lab/assets/sources/highlights/arrow-03.svg
          )

          for file in "${files[@]}"; do
            test -s "$file"
            printf '%8s  %s\n' "$(wc -c < "$file")" "$file"
          done

          grep -q "GSAP 3.15.0" motion-lab/vendor/gsap/gsap.min.js
          grep -qi "<svg" motion-lab/assets/sources/open-doodles/groovy.svg
          grep -qi "<svg" motion-lab/assets/sources/open-peeps/peep-57.svg
          grep -qi "<svg" motion-lab/assets/sources/highlights/arrow-01.svg

      - name: Commit assets to the lab branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion-lab/vendor/gsap motion-lab/assets/sources
          if git diff --cached --quiet; then
            echo "Assets already present; nothing to commit."
            exit 0
          fi
          git commit -m "chore: vendor Athena motion lab starter assets"
          git push origin HEAD:athena-motion-lab-v0
